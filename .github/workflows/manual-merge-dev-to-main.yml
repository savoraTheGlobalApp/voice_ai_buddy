name: Manual Merge Dev to Main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
      
      - name: Generate detailed commit message
        id: commit-msg
        run: |
          git fetch origin main dev
          
          # Get commit count
          COMMIT_COUNT=$(git rev-list --count origin/main..origin/dev 2>/dev/null || echo "0")
          
          # Get commit list
          COMMIT_LIST=$(git log origin/main..origin/dev --oneline --no-decorate | head -10 | sed 's/^/- /' || echo "No commits")
          
          # Get file changes summary
          FILE_CHANGES=$(git diff --stat origin/main..origin/dev | tail -1 || echo "No changes")
          
          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only origin/main..origin/dev | head -20 | sed 's/^/  - /' || echo "")
          
          # Create detailed commit message
          cat > /tmp/commit_msg.txt << EOF
          Merge dev to main: $(date +'%Y-%m-%d %H:%M:%S')
          
          Summary:
          - Commits merged: $COMMIT_COUNT
          - Files changed: $FILE_CHANGES
          
          Commits included:
          $COMMIT_LIST
          
          Files changed:
          $CHANGED_FILES
          EOF
          
          # Store message for next step
          echo "message<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/commit_msg.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Show what will be merged
        run: |
          echo "## Commits in dev that are not in main:"
          git fetch origin main dev
          git log origin/main..origin/dev --oneline || echo "No new commits"
          echo ""
          echo "## Files changed:"
          git diff --stat origin/main..origin/dev || echo "No changes"
      
      - name: Check if merge is needed
        id: check-merge
        run: |
          if git diff --quiet origin/main...origin/dev; then
            echo "no_merge=true" >> $GITHUB_OUTPUT
            echo "⚠️ No changes to merge - dev and main are already in sync"
          else
            echo "no_merge=false" >> $GITHUB_OUTPUT
            echo "✅ Changes detected, will merge"
          fi
      
      - name: Merge dev to main
        if: steps.check-merge.outputs.no_merge == 'false'
        run: |
          git checkout main
          git pull origin main
          
          # Use the detailed commit message
          git merge origin/dev --no-ff -m "$(cat /tmp/commit_msg.txt)"
          git push origin main
          
          echo "✅ Successfully merged dev to main"
          echo "📝 Commit message includes detailed information"
      
      - name: Skip merge (already in sync)
        if: steps.check-merge.outputs.no_merge == 'true'
        run: |
          echo "ℹ️ Skipping merge - dev and main are already in sync"
